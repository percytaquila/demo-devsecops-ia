# Workflow de seguridad para cada Pull Request hacia main (tarea B1)
# Corre 3 escaneos en paralelo; si alguno encuentra algo, el check queda en rojo.
name: Seguridad en Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  # 1) SAST: busca fallas en el código (inyección SQL, XSS, etc.)
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Reglas usadas:
      #   p/default        -> reglas generales de seguridad de Semgrep
      #   p/owasp-top-ten  -> reglas enfocadas en el OWASP Top 10
      #   semgrep-rules/   -> reglas propias del equipo (ej. inyección SQL)
      # Regla excluida (decisión de triage):
      #   CSRF: la cookie de sesión usa SameSite=strict y la API solo acepta JSON,
      #   lo que mitiga CSRF (ver app/src/app.js). Por eso no se exige un middleware CSRF.
      # Reglas de configuración de cookie excluidas (triage del 27/11/2026, app/src/app.js):
      #   no-domain:  sin domain la cookie es host-only, que es más restrictivo (falso positivo).
      #   no-path:    el path por defecto "/" es el correcto para esta app (falso positivo).
      #   no-expires: la app usa maxAge (1 hora), equivalente a expires (falso positivo).
      #   no-secure:  secure es configurable (COOKIE_SECURE) porque la demo corre por HTTP
      #               en local. Riesgo aceptado: en producción debe usarse COOKIE_SECURE=true.
      # Solo se escanea la carpeta app/ (el código de la aplicación).
      - name: Escanear código con Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config semgrep-rules/ \
            --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-domain \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-path \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-expires \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-secure \
            --error --json-output=semgrep.json \
            app/
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semgrep
          path: semgrep.json

  # 2) Secretos: busca claves, tokens o contraseñas escritas en el código
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear secretos con Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo --report-format json --report-path /repo/gitleaks.json \
            --exit-code 1 --verbose
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-gitleaks
          path: gitleaks.json

  # 3) SCA: busca librerías con vulnerabilidades conocidas (CVE)
  trivy:
    name: Dependencias (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear dependencias con Trivy
        run: |
          # 1. Escanea y guarda el reporte completo (para Claude en la tarea B2)
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 \
            fs --scanners vuln --severity HIGH,CRITICAL \
            --format json --output /src/trivy.json /src/app
          # 2. Muestra la tabla de resultados directamente en el log
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 \
            convert --format table /src/trivy.json
          # 3. Falla el check si hay vulnerabilidades HIGH o CRITICAL
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "Vulnerabilidades HIGH/CRITICAL encontradas: $total"
          if [ "$total" -gt 0 ]; then exit 1; fi
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-trivy
          path: trivy.json

  # 4) Revisión con IA (tarea B2): Claude lee los 3 reportes y comenta en el PR
  claude-review:
    name: Revisión de Claude
    needs: [semgrep, gitleaks, trivy]
    # Corre siempre que sea un PR, aunque algún escáner haya fallado
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar reportes de los escáneres
        uses: actions/download-artifact@v4
        with:
          path: reportes/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude analiza los hallazgos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > prompt.txt <<'EOF'
          Eres un asistente de seguridad (DevSecOps) que revisa un Pull Request.

          En la carpeta reportes/ están los reportes de 3 herramientas:
          - reportes/reporte-semgrep/semgrep.json   (SAST: fallas en el código)
          - reportes/reporte-gitleaks/gitleaks.json (secretos escritos en el código)
          - reportes/reporte-trivy/trivy.json       (dependencias con vulnerabilidades)
          Resultado de cada check: Semgrep=${{ needs.semgrep.result }},
          Gitleaks=${{ needs.gitleaks.result }}, Trivy=${{ needs.trivy.result }}.
          Si falta algún reporte, indícalo en el comentario.

          Escribe UN comentario en Markdown, en español sencillo, para el equipo:
          1. Título: "## 🤖 Revisión de seguridad con IA (Claude)".
          2. Resumen de 1 o 2 líneas: cuántos hallazgos hay y si el PR es seguro para integrar.
          3. Una tabla con columnas: # | Severidad (Crítica/Alta/Media/Baja) | Herramienta |
             Archivo:línea | Problema. Agrupa en una sola fila los hallazgos duplicados que
             reportan varias herramientas. Ordena de mayor a menor severidad.
          4. Por cada hallazgo, una sección corta con:
             - El riesgo, explicado en 1 o 2 frases y sin jerga.
             - Cómo corregirlo, con el fragmento de código corregido
               (lee el archivo afectado del repositorio para proponerlo).
          5. Si no hay hallazgos, di que los 3 controles pasaron y que el PR está limpio.

          Reglas:
          - No inventes hallazgos que no estén en los reportes.
          - Nunca muestres el valor completo de un secreto: enmascáralo (ejemplo: Zx9Q****).
          - Termina con: "_La IA asiste: una persona debe revisar estas sugerencias antes de aplicarlas._"
          - Responde solo con el comentario, sin texto adicional.
          EOF
          claude -p "$(cat prompt.txt)" \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 15 \
            --output-format text > comentario.md
          cat comentario.md
      - name: Publicar comentario en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actualiza el comentario anterior de la revisión; si no existe, crea uno nuevo
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --body-file comentario.md \
          || gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body-file comentario.md
