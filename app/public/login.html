<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - TiendaDemo</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <nav id="menu" class="menu"></nav>
  <main>
    <h1>Iniciar sesión</h1>
    <form id="login-form" class="form" autocomplete="on">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" maxlength="50" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" maxlength="100" required autocomplete="current-password">

      <button type="submit">Entrar</button>
      <p id="message" class="error" role="alert"></p>
    </form>
  </main>
</body>
</html>
